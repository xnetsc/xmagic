# Single-port multi-protocol proxy gateway ("xmagic").
#
#   dispatcher (sniff.py)  binds the one public port (XRAY_PORT) and routes
#     by content: SSH banner -> sshd, 0x05 -> SOCKS5, HTTP CONNECT /
#     absolute-form -> HTTP proxy, WebSocket -> Xray fallback mux (WS paths,
#     then bare Shadowsocks as default), origin-form HTTP (a browser) ->
#     the admin console, anything else -> Xray mux.
#   xray                   the mux + all loopback backends; config.json is
#     rendered from the SQLite identity DB (./data/users.db).
#   sshd                   the node's real SSH entry; authorized_keys is
#     rendered from the same DB.
#   admin                  Passkey-only web console + the users.py CLI.
#     Shares ./data, renders config after every change and restarts the
#     xray/sshd containers over the Docker socket. It has no public port
#     of its own: it listens on a loopback backend port and the
#     dispatcher routes the console's share of the one public port to it.
#   watchtower             daily auto-update of the labeled images (xray,
#     dispatcher) - new builds land here from CI, including Xray version
#     bumps made by the upstream-check workflow.
#
# Host networking for the gateway services is deliberate: the whole
# design is loopback wiring between dispatcher, Xray backends and sshd.
#
# First run:
#   cp .env.example .env        # set XRAY_PORT etc.
#   docker compose up -d        # admin renders an empty config at boot
#   # open http://<host>:8080 - the console shares the public port
#   # register the admin passkey, then add users in the console - every
#   # change re-renders and restarts the gateway automatically.
# CLI instead of / in addition to the console (same engine, same DB):
#   docker compose run --rm admin python3 users.py add alice
#   docker compose run --rm admin python3 users.py apply
#   docker compose run --rm admin python3 users.py status

x-gateway-env: &gateway-env
  XRAY_PORT: "${XRAY_PORT:-8080}"
  XRAY_MUX_PORT: "${XRAY_MUX_PORT:-18080}"
  BE_HTTP_PORT: "${BE_HTTP_PORT:-18081}"
  BE_SOCKS_PORT: "${BE_SOCKS_PORT:-18082}"
  XRAY_REALITY_PORT: "${XRAY_REALITY_PORT:-18083}"
  SS_BE_PORT: "${SS_BE_PORT:-12003}"
  VLESS_BE_BASE: "${VLESS_BE_BASE:-12100}"
  TROJAN_BE_BASE: "${TROJAN_BE_BASE:-12200}"
  SSWS_BE_BASE: "${SSWS_BE_BASE:-12300}"
  SSH_BE_PORT: "${SSH_BE_PORT:-12222}"
  ADMIN_BE_PORT: "${ADMIN_BE_PORT:-18090}"
  SSH_TUNNEL_BASE: "${SSH_TUNNEL_BASE:-13000}"
  VLESS_WS_PATHS: "${VLESS_WS_PATHS:-/vless-ws}"
  TROJAN_WS_PATHS: "${TROJAN_WS_PATHS:-/trojan-ws}"
  SS_WS_PATHS: "${SS_WS_PATHS:-/ss-ws}"
  SS_METHOD: "${SS_METHOD:-aes-256-gcm}"
  UPSTREAM_STRATEGY: "${UPSTREAM_STRATEGY:-roundRobin}"
  DIRECT_ALLOW_PRIVATE: "${DIRECT_ALLOW_PRIVATE:-}"
  VLESS_ENABLED: "${VLESS_ENABLED:-}"
  REALITY_ENABLED: "${REALITY_ENABLED:-}"
  REALITY_DEST: "${REALITY_DEST:-}"
  REALITY_SERVER_NAMES: "${REALITY_SERVER_NAMES:-}"
  REALITY_SHORT_IDS: "${REALITY_SHORT_IDS:-}"
  XMAGIC_ENABLE_SOCKS5: "${XMAGIC_ENABLE_SOCKS5:-}"
  XMAGIC_ENABLE_SSH: "${XMAGIC_ENABLE_SSH:-}"

services:
  xray:
    image: ghcr.io/xnetsc/xmagic-xray:latest
    build:
      context: .
      dockerfile: Dockerfile.xray
      args:
        XRAY_VERSION: "${XRAY_VERSION:-26.10.31}"
    container_name: proxy-xray
    restart: unless-stopped
    network_mode: host
    command: ["run", "-c", "/data/config.json"]
    volumes:
      # Mount the data DIRECTORY, never the config file itself: with a
      # file bind mount, Docker creates a DIRECTORY at the source path
      # when it does not exist yet (every first boot), which then
      # blocks the admin's render at that path forever.
      - ./data:/data:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  dispatcher:
    image: ghcr.io/xnetsc/xmagic-dispatcher:latest
    build:
      context: .
      dockerfile: Dockerfile.dispatcher
    container_name: proxy-dispatcher
    restart: unless-stopped
    network_mode: host
    environment: *gateway-env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - xray

  # SSH support is off by default (XMAGIC_ENABLE_SSH, see .env.example):
  # this service sits behind the "ssh" profile, so a plain compose up
  # does not start it. Enable with COMPOSE_PROFILES=ssh (plus
  # XMAGIC_ENABLE_SSH=1 so the dispatcher routes SSH and the console
  # accepts SSH configuration) or `docker compose --profile ssh up`.
  sshd:
    image: ghcr.io/xnetsc/xmagic-sshd:latest
    build:
      context: .
      dockerfile: Dockerfile.sshd
    container_name: proxy-sshd
    restart: unless-stopped
    network_mode: host
    profiles: ["ssh"]
    environment:
      SSH_BE_PORT: "${SSH_BE_PORT:-12222}"
    volumes:
      # Directory mount for the same reason as the xray service. At
      # every start the image entrypoint stages the host keys from
      # the volume as 0600 copies under /tmp and passes them with
      # -h; authorized_keys is fetched by sshd through a root-owned
      # cat of /data/authorized_keys (AuthorizedKeysCommand), so
      # rendered key changes take effect with no restart at all.
      - ./data:/data:ro
      - ./data/ssh_host_keys:/etc/ssh/keys
    depends_on:
      - xray

  admin:
    image: ghcr.io/xnetsc/xmagic-admin:latest
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: proxy-admin
    restart: unless-stopped
    ports:
      # Loopback backend only - the dispatcher routes the console's
      # origin-form HTTP on the public port to this port.
      - "127.0.0.1:${ADMIN_BE_PORT:-18090}:8090"
    environment:
      <<: *gateway-env
    volumes:
      - ./data:/data
      # Lets the console restart xray/sshd after a render. Remove this
      # mount to make the console render-only (restarts then manual).
      - /var/run/docker.sock:/var/run/docker.sock

  # Optional: holds `ssh -N -D` tunnels for `ssh` upstreams recorded in
  # the DB. Enable only when a render reported ssh tunnels:
  #   docker compose --profile cascade up -d
  tunnels:
    image: alpine:3.20
    container_name: proxy-tunnels
    restart: unless-stopped
    network_mode: host
    profiles: ["cascade"]
    command: ["sh", "/data/start-tunnels.sh"]
    volumes:
      - ./data:/data:ro
      - ${SSH_KEY_DIR:-./data/ssh_client_keys}:/keys:ro
    depends_on:
      - xray

  watchtower:
    image: containrrr/watchtower
    container_name: proxy-watchtower
    restart: unless-stopped
    command: ["--interval", "86400", "--label-enable"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
