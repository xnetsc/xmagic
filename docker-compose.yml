# Single-port multi-protocol proxy gateway ("xmagic").
#
#   dispatcher (sniff.py)  binds the one public port (XRAY_PORT) and routes
#     by first bytes: SSH banner -> sshd, 0x05 -> SOCKS5, HTTP CONNECT /
#     absolute-form -> HTTP proxy, WebSocket -> Xray fallback mux (WS paths,
#     then bare Shadowsocks as default), anything else -> Xray mux.
#   xray                   the mux + all loopback backends; config.json is
#     rendered from the SQLite identity DB (./data/users.db).
#   sshd                   the node's real SSH entry; authorized_keys is
#     rendered from the same DB.
#   admin                  Passkey-only web console + the users.py CLI.
#     Shares ./data, renders config after every change and restarts the
#     xray/sshd containers over the Docker socket. Published on the host
#     (XMAGIC_ADMIN_PORT, default 8090) so the console is reachable from
#     anywhere; set XMAGIC_ADMIN_BIND=127.0.0.1 to lock it to loopback.
#   watchtower             daily auto-update of the labeled images (xray,
#     dispatcher) - new builds land here from CI, including Xray version
#     bumps made by the upstream-check workflow.
#
# Host networking for the gateway services is deliberate: the whole
# design is loopback wiring between dispatcher, Xray backends and sshd.
#
# First run:
#   cp .env.example .env        # set XRAY_PORT etc.
#   docker compose up -d        # admin renders an empty config at boot
#   # open http://127.0.0.1:8090 (or: ssh -L 8090:127.0.0.1:8090 <host>)
#   # register the admin passkey, then add users in the console - every
#   # change re-renders and restarts the gateway automatically.
# CLI instead of / in addition to the console (same engine, same DB):
#   docker compose run --rm admin python3 users.py add alice
#   docker compose run --rm admin python3 users.py apply
#   docker compose run --rm admin python3 users.py status

x-gateway-env: &gateway-env
  XRAY_PORT: "${XRAY_PORT:-8080}"
  XRAY_MUX_PORT: "${XRAY_MUX_PORT:-18080}"
  BE_HTTP_PORT: "${BE_HTTP_PORT:-18081}"
  BE_SOCKS_PORT: "${BE_SOCKS_PORT:-18082}"
  SS_BE_PORT: "${SS_BE_PORT:-12003}"
  VLESS_BE_BASE: "${VLESS_BE_BASE:-12100}"
  TROJAN_BE_BASE: "${TROJAN_BE_BASE:-12200}"
  SSH_BE_PORT: "${SSH_BE_PORT:-12222}"
  SSH_TUNNEL_BASE: "${SSH_TUNNEL_BASE:-13000}"
  VLESS_WS_PATHS: "${VLESS_WS_PATHS:-/vless-ws}"
  TROJAN_WS_PATHS: "${TROJAN_WS_PATHS:-/trojan-ws}"
  SS_METHOD: "${SS_METHOD:-aes-256-gcm}"
  UPSTREAM_STRATEGY: "${UPSTREAM_STRATEGY:-roundRobin}"

services:
  xray:
    image: ghcr.io/xnetsc/xmagic-xray:latest
    build:
      context: .
      dockerfile: Dockerfile.xray
      args:
        XRAY_VERSION: "${XRAY_VERSION:-26.10.31}"
    container_name: proxy-xray
    restart: unless-stopped
    network_mode: host
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./data/config.json:/etc/xray/config.json:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  dispatcher:
    image: ghcr.io/xnetsc/xmagic-dispatcher:latest
    build:
      context: .
      dockerfile: Dockerfile.dispatcher
    container_name: proxy-dispatcher
    restart: unless-stopped
    network_mode: host
    environment: *gateway-env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - xray

  sshd:
    image: ghcr.io/xnetsc/xmagic-sshd:latest
    build:
      context: .
      dockerfile: Dockerfile.sshd
    container_name: proxy-sshd
    restart: unless-stopped
    network_mode: host
    environment:
      SSH_BE_PORT: "${SSH_BE_PORT:-12222}"
    volumes:
      - ./data/authorized_keys:/home/proxy/.ssh/authorized_keys:ro
      - ./data/ssh_host_keys:/etc/ssh/keys
    depends_on:
      - xray

  admin:
    image: ghcr.io/xnetsc/xmagic-admin:latest
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: proxy-admin
    restart: unless-stopped
    ports:
      - "${XMAGIC_ADMIN_BIND:-0.0.0.0}:${XMAGIC_ADMIN_PORT:-8090}:8090"
    environment:
      <<: *gateway-env
      XMAGIC_ADMIN_RPID: "${XMAGIC_ADMIN_RPID:-localhost}"
      XMAGIC_ADMIN_ORIGINS: "${XMAGIC_ADMIN_ORIGINS:-http://localhost:${XMAGIC_ADMIN_PORT:-8090},http://127.0.0.1:${XMAGIC_ADMIN_PORT:-8090}}"
    volumes:
      - ./data:/data
      # Lets the console restart xray/sshd after a render. Remove this
      # mount to make the console render-only (restarts then manual).
      - /var/run/docker.sock:/var/run/docker.sock

  # Optional: holds `ssh -N -D` tunnels for `ssh` upstreams recorded in
  # the DB. Enable only when a render reported ssh tunnels:
  #   docker compose --profile cascade up -d
  tunnels:
    image: alpine:3.20
    container_name: proxy-tunnels
    restart: unless-stopped
    network_mode: host
    profiles: ["cascade"]
    command: ["sh", "/app/start-tunnels.sh"]
    volumes:
      - ./data/start-tunnels.sh:/app/start-tunnels.sh:ro
      - ${SSH_KEY_DIR:-./data/ssh_client_keys}:/keys:ro
    depends_on:
      - xray

  watchtower:
    image: containrrr/watchtower
    container_name: proxy-watchtower
    restart: unless-stopped
    command: ["--interval", "86400", "--label-enable"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
